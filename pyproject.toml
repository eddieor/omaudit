[project]
name = "omaudit"
version = "0.1.0"
description = "Capability audit for Omarchy Quattro shell plugins"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
omaudit = "omaudit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["omaudit"]
